[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granthstudio"
version = "0.1.0"
description = "GranthStudio Zero-DB v3.1 episode-production runner"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
granthstudio = "granthstudio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
granthstudio = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]
