# Global visual style baseline, locked by the owner (Satvik Sangamkar, 2026-10-23). Art-style part of O-006 only: no SDXL checkpoint or identity conditioning is chosen here.
# content_sha256 seals every field except notes; an edit without re-sealing, or a change that keeps the style_id/version, is refused at load time (src/granthstudio/style.py).
style_id: devotional_gouache_1950s_v1
version: 1
status: frozen
scope: global
approved_by: Satvik Sangamkar
approved_on: '2026-10-23'
positive_style:
  prefix: 1950s vintage Indian devotional book illustration, authentic mid-century opaque gouache and egg tempera painting on aged matte ivory cardstock, soft hand-painted sepia contour linework, chalky matte gouache wash shading, flat hand-brushed tonal planes,
  suffix: warm natural mineral pigments of raw sienna, burnt umber, warm ochre, terracotta, and muted sage green, subtle paper grain texture, vintage double-line paper border mount, clean traditional graphic composition, text-free, no labels, no watermarks.
  combined: 1950s vintage Indian devotional book illustration, authentic mid-century opaque gouache and egg tempera painting on aged matte ivory cardstock, soft hand-painted sepia contour linework, chalky matte gouache wash shading, flat hand-brushed tonal planes, warm natural mineral pigments of raw sienna, burnt umber, warm ochre, terracotta, and muted sage green, subtle paper grain texture, vintage double-line paper border mount, clean traditional graphic composition, text-free, no labels, no watermarks.
negative_style: photorealistic, 3D render, CGI, digital painting gloss, airbrushed gradients, shiny plastic skin, modern photography, harsh lens flare, neon colors, oil impasto, heavy black comic ink, blurry contours, text, typography, signature, watermarks.
runner_prompt_rule:
  mode: prefix_middle_suffix
  middle_placeholder: <shot description>
  final_prompt_template: '{prefix} {shot_description} {suffix}'
enforcement:
  lock_style_globally: true
  allow_per_shot_override: false
  use_same_style_for_marathi_and_hindi: true
  require_negative_prompt: true
  forbid_text_in_image: true
  forbid_watermarks: true
receipt_binding:
  record_style_id: true
  record_style_version: true
  record_style_hash: true
notes:
- Freeze this as the global visual style baseline.
- Characters, locations and props may remain provisional for now.
- This style must be applied uniformly across storyboard, keyframes, images and video generation prompts.
- Any future style change must create a new style_id/version and require explicit approval.
